server:
  port: 8089

spring:
  application:
    name: gateway-sensoritoys
  cloud:
    gateway:
      routes:
        - id: ms-usuarios
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/usuarios/**

        - id: ms-productos
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/productos/**

        - id: ms-pedidos
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/pedidos/**